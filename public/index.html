<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Pharmacy Shopping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <span class="navbar-brand fw-bold">Online Pharmacy Shopping</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">Products</h2>
            <span class="badge text-bg-success" id="productCount">0</span>
          </div>
          <div class="card-body">
            <div id="productList" class="row g-3"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white">
            <h2 class="h5 mb-0">Cart</h2>
          </div>
          <div class="card-body">
            <div id="cartList" class="mb-3 text-muted">Cart is empty.</div>
            <div class="d-flex justify-content-between fw-bold">
              <span>Total</span>
              <span id="cartTotal">€0.00</span>
            </div>
            <button class="btn btn-success w-100 mt-3" id="checkoutBtn">Checkout</button>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h2 class="h5 mb-0">Checkout</h2>
          </div>
          <div class="card-body">
            <div id="messageBox"></div>
            <form id="checkoutForm">
              <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input class="form-control" id="customerName" required minlength="2">
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input class="form-control" id="phone" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" id="address" required minlength="5"></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Place Order</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h2 class="h5 mb-0">Order History</h2>
          </div>
          <div class="card-body table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Total</th>
                  <th>Items</th>
                </tr>
              </thead>
              <tbody id="ordersTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
